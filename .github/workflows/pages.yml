name: Deploy interactive portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate front-end JavaScript
        run: node --check site/app.js

      - name: Validate deep-agent demo markers
        shell: bash
        run: |
          grep -q "no_character_death" site/app.js
          grep -q "家业" site/app.js
          grep -q "isRealPoster" site/app.js
          grep -q "OPENAI" src/llm_agent.py || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static agent
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
