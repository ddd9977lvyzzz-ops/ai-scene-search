name: Expand full project bundle

on:
  push:
    branches: [main]
    paths:
      - "bundle/ai-scene-search-v1.1-portable.zip"
      - ".github/workflows/expand-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .bundle-expanded-v1.1 ]; then
            echo "Bundle already expanded."
            exit 0
          fi
          rm -rf /tmp/ai-scene-search
          mkdir -p /tmp/ai-scene-search
          unzip -q -o bundle/ai-scene-search-v1.1-portable.zip -d /tmp/ai-scene-search
          rsync -a --exclude ".git" /tmp/ai-scene-search/ ./

          cat > .github/workflows/pages.yml <<'YAML'
          name: Deploy interactive portfolio to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Configure Pages
                  uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - name: Upload static agent
                  uses: actions/upload-pages-artifact@v4
                  with:
                    path: site
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

          touch .bundle-expanded-v1.1

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Expand full V1.1 source project"
          git push origin HEAD:main
