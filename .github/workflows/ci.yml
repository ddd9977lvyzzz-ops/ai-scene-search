name: Core logic CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "data_pipeline/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "data_pipeline/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  deterministic-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src scripts data_pipeline
      - name: Run hard-boundary tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
