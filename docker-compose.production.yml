services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      CATALOG_DB: /app/db/catalog.sqlite3
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      EVENT_DB: /tmp/scene_events.sqlite3
      OPENAI_INTENT_ENABLED: "0"
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
volumes:
  redis-data:
