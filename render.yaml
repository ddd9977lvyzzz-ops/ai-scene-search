services:
  - type: web
    name: ying-scene-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: CATALOG_DB
        value: /app/db/catalog.sqlite3
      - key: SESSION_DB
        value: /tmp/ying_session.sqlite3
      - key: EVENT_DB
        value: /tmp/ying_events.sqlite3
      - key: USER_DB
        value: /tmp/ying_users.sqlite3
      - key: SESSION_BACKEND
        value: sqlite
      - key: OPENAI_AGENT_ENABLED
        value: '1'
      - key: OPENAI_AGENT_REQUIRED
        value: '1'
      - key: OPENAI_AGENT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_API_KEY
        sync: false
      - key: TMDB_API_TOKEN
        sync: false
      - key: POSTER_WORKERS
        value: '10'
      - key: BAIDU_SEARCH_API_KEY
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
